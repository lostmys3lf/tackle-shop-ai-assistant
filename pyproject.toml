[project]
name = "asisten-toko-pancing-papa"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "openai>=3.49.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]


